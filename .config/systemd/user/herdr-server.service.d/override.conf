# Image paste needs the desktop session's display env; systemd user services
# don't always inherit it depending on startup order. Wayland only, no X11.
[Service]
Environment=WAYLAND_DISPLAY=wayland-0

# herdr's agent panes attach to the shared bili proxy. If bili is not up when an
# agent starts, that agent spawns its own proxy. Require+order bili so herdr is
# never running while bili is down; PartOf brings herdr back when bili restarts.
# Note: a hard Requires stops herdr whenever bili stops, by design.
[Unit]
Requires=bili.service
After=bili.service
PartOf=bili.service
