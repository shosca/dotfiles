# remap prefix to `
unbind C-b
set-option -g prefix `
bind ` send-prefix
bind-key C-a last-window

bind [ copy-mode

set -sg repeat-time 300
set -g history-limit 50000
set -g base-index 1
set-option -g renumber-windows on

# disable bell
set -g bell-action none
#set -g bell-on-alert off

set -s set-clipboard external

# enable mouse
set-option -g mouse on

set -g default-terminal "tmux-256color"
set -as terminal-features ',rxvt-unicode-256color:clipboard'
set -as terminal-features ',ghostty:extkeys'
set -as terminal-features ',xterm-256color:extkeys'
set -g extended-keys on
set -ga terminal-overrides "xterm*:colors=256"
set -ga terminal-overrides ",xterm*:Tc"
set -ga terminal-overrides ",alacritty*:Tc"

set-option -g set-titles on
set-option -g set-titles-string '#H:#S.#I.#P #W #T' # window number,program name, active(or not)

# window titles follow the running program (agent panes self-identify).
# claude sets its topic via OSC 0, which tmux records as pane_title, not the window
# name -- so auto-rename off left the name stuck at "zsh". Mirror pane_title instead,
# falling back to the command when it is still the default hostname (a plain shell,
# or claude while a tool call holds the tty).
set -g allow-rename on
set -g automatic-rename on
set -g automatic-rename-format '#{?#{==:#{pane_title},#{host_short}},#{?pane_in_mode,[tmux],#{pane_current_command}}#{?pane_dead,[dead],},#{=24:#{pane_title}}}'

# watch background windows
setw -g monitor-activity on

# use vi bindings for tmux input
setw -g mode-keys vi
unbind p
unbind P
bind ] paste-buffer
set-option -g status-keys vi
# no right-click pane menu (built-in default re-binds this on every source)
unbind -T root MouseDown3Pane
unbind -T root M-MouseDown3Pane

# force a reload of the config file
unbind r
bind r source-file ~/.config/tmux/tmux.conf
bind ? list-keys

# copy mode
bind y copy-mode

# panes
bind x kill-pane
bind z resize-pane -Z

# matches herdr config.toml split_horizontal/split_vertical (prefix+- / prefix+\)
bind-key "-" split-window -v -c "#{pane_current_path}"
bind-key "\\" split-window -h -c "#{pane_current_path}"

# quick pane cycling
bind -r j select-pane -t :.+
bind -r k select-pane -t :.-

# pane resize (one-shot, like herdr)
bind -r Left  resize-pane -L 5
bind -r Down  resize-pane -D 5
bind -r Up    resize-pane -U 5
bind -r Right resize-pane -R 5

# windows -> herdr tabs
bind t command-prompt -p "window name" "new-window -n '%%' -c '#{pane_current_path}'"
bind w command-prompt -I "#W" "rename-window -- '%%'"
bind -r h previous-window
bind -r l next-window
bind -n C-PPage previous-window
bind -n C-NPage next-window
bind 1 select-window -t 1
bind 2 select-window -t 2
bind 3 select-window -t 3
bind 4 select-window -t 4
bind 5 select-window -t 5
bind 6 select-window -t 6
bind 7 select-window -t 7
bind 8 select-window -t 8
bind 9 select-window -t 9

# sessions -> herdr workspaces
bind c new-session
bind R command-prompt -I "#S" "rename-session -- '%1'"
bind K kill-session
bind -r p switch-client -p
bind -r n switch-client -n

# closing a non-main session falls back to main; closing main detaches (exits)
set -g @home-session main
# highlight active session in the bottom bar (matches window-status-current style)
set -g session-status-style "fg=default"
set -g session-status-current-style "fg=black,bg=white"
set -g detach-on-destroy off
# closing a non-main session falls back to main; closing main detaches (exits)
# session fallback: closed session's clients move to the last remaining session;
# if that was the last session, clients detach (terminal exits)
set -g detach-on-destroy off
set-hook -g session-closed 'run-shell tmux-rehome-clients'

bind -r n switch-client -n

set -g status-style "fg=default bg=default"
set -g pane-border-style "fg=default bg=default"
set -g pane-active-border-style "fg=green bg=default"
set -g message-style "fg=black bg=yellow"
set -g mode-style "fg=black bg=green"
set -g display-panes-active-colour green
set -g display-panes-colour blue

# Custom status bar
# Powerline symbols:    
set-option -g status-left-length 100
# no session name before the window list (sessions shown in bottom bar instead)
set-option -g status-left '#[fg=white,bg=black] #[fg=green]#S #[fg=black,bg=default]#[default] '
set-option -g status-right-length 150
set -g status-right '#[fg=green]#[fg=white] %A, %d %b %Y %I:%M %p #[fg=black,bg=green] #h '
set -g status-justify left
set -g status on
set -g status-position bottom
set -g status-format[0] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set -g window-status-format "#[default]  #I:#W  #[default]"
set -g window-status-current-format "#[fg=black,bg=white] #I:#W #[fg=white,bg=black]#[default]"

set -g pane-border-status top
set -g pane-border-format " #S:#I:#{pane_index} #{pane_current_command} "
