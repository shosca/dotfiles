# kitty config, ported from the Ghostty config at .config/ghostty/config

font_family VictorMono Nerd Font Mono
font_size 10

# Ghostty runs `command = /usr/bin/zsh --login` directly.
shell /usr/bin/zsh --login

# Ayu Dark (Ghostty bundled theme, /usr/share/ghostty/themes/Ayu).
background #0b0e14
foreground #bfbdb6
cursor #e6b450
cursor_text_color #0b0e14
selection_background #409fff
selection_foreground #0b0e14

color0 #11151c
color1 #ea6c73
color2 #7fd962
color3 #f9af4f
color4 #53bdfa
color5 #cda1fa
color6 #90e1c6
color7 #c7c7c7
color8 #686868
color9 #f07178
color10 #aad94c
color11 #ffb454
color12 #59c2ff
color13 #d2a6ff
color14 #95e6cb
color15 #ffffff

background_opacity 0.80

# Copy the selection to CLIPBOARD, so ctrl+shift+v and shift+insert agree.
copy_on_select clipboard

# Reload config. Ghostty binds ctrl+shift+r; kitty defaults to ctrl+shift+f5.
map ctrl+shift+r load_config_file

# Paste CLIPBOARD. Overrides the kitty default, which pastes the selection.
map shift+insert paste_from_clipboard

# Ghostty prefix-key binds, left unused there. kitty has no direct
# "split right/down" action; new_window splits along the active layout.
# map ctrl+shift+backslash new_window
# map next_window
# map previous_window
# map ctrl+shift+page_up previous_tab
# map ctrl+shift+page_down next_tab

# >>> herdr-radar font block
symbol_map U+E1A0-U+E1BA Herdr Agent Icons Max
symbol_map U+E1C0-U+E1C5 Herdr Agent Icons Max
# <<< herdr-radar font block
