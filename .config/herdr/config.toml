onboarding = false
# Mirrors the Omarchy tmux config in config/tmux/tmux.conf
# tmux session -> herdr workspace, tmux window -> herdr tab, tmux pane -> herdr pane

[theme]
# catppuccin, with the active row from the herdr-radar block at the end of this file
name = "catppuccin"
auto_switch = false

# >>> herdr-radar theme block
[theme.custom]
active_row_bg = "#414868"
# <<< herdr-radar theme block

[terminal]
# Matches -c "#{pane_current_path}" on every split, window, and session
new_cwd = "follow"
# Login shells so ~/.zprofile (and ~/.profile) run; Linux "auto" is non-login
shell_mode = "login"

[keys]
prefix = "`"

# Config and help
reload_config = "prefix+r"
help = "prefix+?"
detach = "prefix+d"

# Copy mode
copy_mode = "prefix+y"

# Panes
# herdr names splits by divider orientation (opposite of wezterm's pane layout naming)
split_horizontal = "prefix+-"
split_vertical = "prefix+\\"
close_pane = "prefix+x"
zoom = "prefix+z"
last_pane = "prefix+;"

# Like wezterm's ActivatePaneDirection Next/Prev
cycle_pane_next = "prefix+j"
cycle_pane_previous = "prefix+k"

# Prefixed resize, like resize-mode but one shot
resize_pane_left = "prefix+left"
resize_pane_down = "prefix+down"
resize_pane_up = "prefix+up"
resize_pane_right = "prefix+right"

# No tmux equivalent; herdr's default prefix+shift+p is taken by previous session
rename_pane = "prefix+shift+o"

# Windows -> tabs
new_tab = "prefix+t"
rename_tab = ""
close_tab = ""
switch_tab = "prefix+1..9"
previous_tab = "prefix+h"
next_tab = "prefix+l"

# Sessions -> workspaces
new_workspace = "prefix+c"
rename_workspace = "prefix+shift+r"
close_workspace = "prefix+shift+k"
# Workspace cycling is the unshifted pair; agents sit on shift.
# Agent cycling follows agent panel order, grouped by space per agent_panel_sort.
previous_workspace = "prefix+p"
next_workspace = "prefix+n"
previous_agent = "prefix+P"
next_agent = "prefix+N"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "hhdebb.herdr-radar.view-flip"  # order: active <-> recent

[[keys.command]]
key = "prefix+comma"
type = "plugin_action"
command = "hhdebb.herdr-radar.settings"  # settings popup

[[keys.command]]
key = "prefix+/"
type = "plugin_action"
command = "herdr-bar.open"
description = "command bar"

[[keys.command]]
key = "prefix+shift+m"
type = "shell"
command = "herdr plugin pane open --plugin herdr-workspace-organizer --entrypoint organizer --focus"
description = "workspace organizer"

[[keys.command]]
key = "prefix+0"
type = "plugin_action"
command = "ray.plugin-manager.open"
description = "open plugin manager"

[ui]
accent = "blue"

# tmux drew single-line dividers between adjacent panes and no outer frame
pane_gaps = false
pane_outer_borders = false

# tmux had no scrollbar column beside its panes
pane_scrollbars = false

# kill-window and kill-session never asked
confirm_close = false

# automatic-rename gave windows a name without prompting
prompt_new_tab_name = false

# set -g mouse on
mouse_capture = true

# Selections also go to the clipboard so ctrl+shift+v matches shift+insert
copy_on_select = true

# status-right had the zoom flag followed by #h; load 1m avg refreshes every 5s
tab_bar_position = "bottom"
tab_bar_right = [
  { type = "zoom" },
  { type = "hostname" },
  { type = "command", command = "cut -d' ' -f1 /proc/loadavg", interval_seconds = 5, timeout_seconds = 2 },
]

# set -g set-titles on / set -g set-titles-string '#h:#W', where tmux's #W was
# the basename of the pane cwd. This is what Hyprland shows in the group bar,
# and it resolves on the server so remote sessions name the remote host.
window_title = "{hostname}: {workspace}"
agent_panel_sort = "spaces"

# tmux was one line per window; keep each agent entry to one sidebar row
status_indicators = "symbols"

[ui.toast]
delivery = "herdr"

# in-TUI agent toasts: mirror the desktop banner corner
[ui.toast.herdr]
position = "top-right"

# Move the copied-text toast out of the bottom-center default into a corner
[ui.toast.clipboard]
position = "top-right"

# Review-queue reviewers end a turn every 15 minutes, so the done sound fired on
# no-change ticks. Desktop notifications are plugin-owned instead
# (~/.config/herdr/plugins/config/liamwh.herdr-rich-notifications/config.toml).
[ui.sound.agents]
claude = "off"

# >>> sidebar layout — covr removed 2026-10-05; native tokens now.
# agents row: state glyph + agent name (session name), colored by status rule.
[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace", { token = "branch", fg = "#7f849c" }, "git_status"]]

[ui.sidebar.agents]
row_gap = 0
rows = [["state_icon", { token = "agent", fg = "#cdd6f4" }]]
# <<< sidebar layout

# Bare-clone + worktrees layout; checkouts land under ~/worktrees/<repo>/<branch-slug>
[worktrees]
directory = "~/worktrees"
