[tools]
"github:hmans/beans" = "latest"
"github:looker-open-source/looker-cli" = "latest"
"npm:billion-context" = "latest"
"npm:chrome-devtools-mcp" = "latest"
"pipx:mycli" = "latest"
"pipx:nexmod" = "latest"
"pipx:yawsso" = { version = "latest" }
age = "latest"
aws-iam-authenticator = "latest"
awsls = "latest"
cdk = "latest"
claude = "latest"
claude-powerline = "latest"
fnox = { version = "latest", workflow = "release.yml" }
gitleaks = "latest"
groovy = "latest"
herdr = "latest"
node = "latest"
oha = "latest"
pi = "latest"
pitchfork = { version = "latest", workflow = "release.yml@refs/heads/main" }
playwright = "latest"
pnpm = "latest"
poetry = "latest"
process-compose = "latest"
rtk = "latest"
trivy = "latest"
uv = "latest"
acli = "latest"

[shell_alias]
pc = "process-compose"
dkr = "docker-compose"

[settings]
trusted_config_paths = ["~/src/force/force-web/"]
experimental = true
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink"

[dotfiles]
"~/.agents" = { source = "~/dotfiles/.agents" }
"~/.claude/CLAUDE.md" = { source = "~/dotfiles/.agents/AGENTS.md" }
"~/.codex/AGENTS.md" = { source = "~/dotfiles/.agents/AGENTS.md" }
"~/.pi/agent/AGENTS.md" = { source = "~/dotfiles/.agents/AGENTS.md" }
"~/.config/AGENTS.md" = { source = "~/dotfiles/.agents/AGENTS.md" }
"~/.aliases" = {}
"~/.bashrc" = {}
"~/.claude/skills" = { source = "~/dotfiles/.agents/skills" }
"~/.config/direnv" = {}
"~/.config/ghostty" = {}
"~/.config/ghpoll" = {}
"~/.config/git" = {}
"~/.config/herdr/config.toml" = {}
"~/.config/kitty" = {}
"~/.config/mise" = {}
"~/.config/npm" = {}
"~/.config/nvim" = {}
"~/.config/opencode/AGENTS.md" = { source = "~/dotfiles/.agents/AGENTS.md" }
"~/.config/opencode/cli.json" = {}
"~/.config/opencode/opencode.json" = {}
"~/.config/opencode/plugins/llamaswap.ts" = {}
"~/.config/opencode/themes" = {}
"~/.config/pacman" = {}
"~/.config/pgsqlrc" = {}
"~/.config/starship.toml" = {}
"~/.config/tmux" = {}
"~/.config/wezterm" = {}
"~/.gemrc" = {}
"~/.inputrc" = {}
"~/.local/bin" = {}
"~/.pdbrc" = {}
"~/.pdbrc.py" = {}
"~/.profile" = {}
"~/.zprofile" = {}
"~/.zshrc" = {}
