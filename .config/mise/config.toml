[tools]
aws-iam-authenticator = "latest"
awsls = "latest"
herdr = "latest"
node = "latest"
"pipx:mycli" = "latest"
"pipx:yawsso" = { version = "latest" }
trivy = "latest"
"github:hmans/beans" = "latest"
cdk = "latest"
playwright = "latest"
"pipx:nexmod" = "latest"
poetry = "latest"
uv = "latest"
gitleaks = "latest"
pnpm = "latest"
duckdb = "latest"
groovy = "latest"
"npm:chrome-devtools-mcp" = "latest"
"github:fajarhide/omni" = "latest"
"github:babarot/claude-recall" = { version = "latest", rename_exe = "recall" }

[settings]
trusted_config_paths = ["~/src/force/force-web/"]
experimental = true
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink"

[dotfiles]
"~/.agents" = { source = "~/dotfiles/.agents" }
"~/.aliases" = {}
"~/.bashrc" = {}
"~/.claude/skills" = { source = "~/dotfiles/.agents/skills" }
"~/.config/direnv" = {}
"~/.config/ghostty" = {}
"~/.config/git" = {}
"~/.config/herdr/config.toml" = {}
"~/.config/kitty" = {}
"~/.config/mise" = {}
"~/.config/npm" = {}
"~/.config/nvim" = {}
"~/.config/opencode/AGENTS.md" = {}
"~/.config/opencode/cli.json" = {}
"~/.config/opencode/opencode.json" = {}
"~/.config/opencode/plugins/llamaswap.ts" = {}
"~/.config/opencode/plugins/opencode-herdr" = { source = "~/dotfiles/.config/opencode/plugins/opencode-herdr" }
"~/.config/opencode/plugins/opencode-tmux" = { source = "~/dotfiles/.config/opencode/plugins/opencode-tmux" }
"~/.config/opencode/plugins/rtk.ts" = {}
"~/.config/opencode/themes" = {}
"~/.config/pacman" = {}
"~/.config/pgsqlrc" = {}
"~/.config/starship.toml" = {}
"~/.config/systemd/user/herdr-server.service" = {}
"~/.config/systemd/user/herdr-server.service.d" = {}
"~/.config/tmux" = {}
"~/.config/wezterm" = {}
"~/.gemrc" = {}
"~/.inputrc" = {}
"~/.local/bin" = {}
"~/.pdbrc" = {}
"~/.pdbrc.py" = {}
"~/.profile" = {}
"~/.zprofile" = {}
"~/.zshrc" = {}
