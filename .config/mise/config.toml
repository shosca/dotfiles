[tools]
awsls = "latest"
"github:can1357/oh-my-pi" = "latest"
node = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:bash-language-server" = "latest"
"npm:pnpm" = "latest"
"npm:vscode-langservers-extracted" = "latest"
opencode = "latest"
"pipx:mycli" = { version = "latest" }
"pipx:pyrefly" = "latest"
"pipx:ruff" = "latest"
"pipx:tmuxp" = { version = "latest" }
"pipx:yawsso" = { version = "latest" }
poetry = { version = "latest" }
pre-commit = { version = "latest" }
prek = "latest"

[settings]
# trusted_config_paths = ["~/src/force/force-web/"]
experimental = true
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink"

[dotfiles]
"~/.aliases" = {}
"~/.bashrc" = {}
"~/.config/direnv" = {}
"~/.config/git" = {}
"~/.config/mise" = {}
"~/.config/npm" = {}
"~/.config/nvim" = {}
"~/.config/pacman" = {}
"~/.config/pgsqlrc" = {}
"~/.config/starship.toml" = {}
"~/.config/wezterm" = {}
"~/.gemrc" = {}
"~/.inputrc" = {}
"~/.local/bin" = {}
"~/.pdbrc" = {}
"~/.pdbrc.py" = {}
"~/.profile" = {}
"~/.tmux.conf" = {}
"~/.zprofile" = {}
"~/.zshrc" = {}
