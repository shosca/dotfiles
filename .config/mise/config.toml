[tools]
aube = "latest"
aws-iam-authenticator = "latest"
awsls = "latest"
"github:looker-open-source/looker-cli" = "latest"
node = "latest"
"npm:@opencode-ai/cli" = { version = "beta", allow_builds = true }
"npm:pnpm" = "latest"
"pipx:mycli" = "latest"
"pipx:semble" = "latest"
"pipx:yawsso" = { version = "latest" }
trivy = "latest"

[settings]
trusted_config_paths = ["~/src/force/force-web/"]
experimental = true
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink"

[dotfiles]
"~/.aliases" = {}
"~/.bashrc" = {}
"~/.config/direnv" = {}
"~/.config/git" = {}
"~/.config/mise" = {}
"~/.config/npm" = {}
"~/.config/nvim" = {}
"~/.config/pacman" = {}
"~/.config/pgsqlrc" = {}
"~/.config/starship.toml" = {}
"~/.config/wezterm" = {}
"~/.gemrc" = {}
"~/.inputrc" = {}
"~/.local/bin" = {}
"~/.pdbrc" = {}
"~/.pdbrc.py" = {}
"~/.profile" = {}
"~/.tmux.conf" = {}
"~/.zprofile" = {}
"~/.zshrc" = {}
